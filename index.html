<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC On Hand</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f0f0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

  #header { padding: 12px 20px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 10px; }
  #status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex-shrink: 0; }
  #status-dot.connected { background: #4caf50; }
  #status-dot.thinking { background: #ff9800; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  #status-text { font-size: 13px; color: #888; flex: 1; }
  #clear-btn { background: #333; border: none; border-radius: 6px; padding: 6px 12px; color: #888; cursor: pointer; font-size: 12px; }
  #clear-btn:hover { background: #444; color: #e0e0e0; }

  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

  .msg { max-width: 80%; }
  .msg.user { align-self: flex-end; }
  .msg.user:hover .resend-btn { opacity: 1; }
  .resend-btn { opacity: 0; background: none; border: none; color: #888; cursor: pointer; font-size: 11px; padding: 2px 6px; margin-top: 4px; transition: opacity 0.15s; display: block; text-align: right; }
  .resend-btn:hover { color: #1a6cf5; }
  .msg.agent { align-self: flex-start; }

  .bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; word-break: break-word; }
  .user .bubble { background: #1a6cf5; color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .agent .bubble { background: #1e1e1e; border: 1px solid #2a2a2a; border-bottom-left-radius: 4px; }
  .agent .bubble p { margin: 0 0 8px; }
  .agent .bubble p:last-child { margin-bottom: 0; }
  .agent .bubble pre { background: #111; border: 1px solid #333; border-radius: 6px; padding: 10px; overflow-x: auto; margin: 8px 0; }
  .agent .bubble code { font-family: "SF Mono", Menlo, monospace; font-size: 13px; }
  .agent .bubble :not(pre) > code { background: #222; padding: 2px 5px; border-radius: 3px; font-size: 12px; }
  .agent .bubble ul, .agent .bubble ol { padding-left: 20px; margin: 6px 0; }
  .agent .bubble h1, .agent .bubble h2, .agent .bubble h3 { margin: 12px 0 6px; font-size: 15px; }
  .agent .bubble blockquote { border-left: 3px solid #444; padding-left: 10px; color: #aaa; margin: 6px 0; }
  .agent .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .agent .bubble th, .agent .bubble td { border: 1px solid #333; padding: 4px 8px; }
  .agent .bubble a { color: #5b9cf5; }

  .tool-block { background: #111; border: 1px solid #2a2a2a; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-family: monospace; color: #888; margin-top: 4px; }
  .tool-block .tool-name { color: #ff9800; margin-bottom: 4px; }

  #input-area { padding: 16px 20px; border-top: 1px solid #222; display: flex; gap: 10px; }
  #input { flex: 1; background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 10px 14px; color: #e0e0e0; font-size: 14px; resize: none; outline: none; max-height: 120px; line-height: 1.5; }
  #input:focus { border-color: #1a6cf5; }
  #send-btn { background: #1a6cf5; border: none; border-radius: 10px; padding: 10px 18px; color: #fff; cursor: pointer; font-size: 14px; flex-shrink: 0; }
  #send-btn:disabled { background: #333; cursor: not-allowed; }
  #interrupt-btn { background: #333; border: none; border-radius: 10px; padding: 10px 14px; color: #888; cursor: pointer; font-size: 13px; flex-shrink: 0; display: none; }
  #interrupt-btn.visible { display: block; }
</style>
</head>
<body>

<div id="header">
  <div id="status-dot"></div>
  <span id="status-text">连接中...</span>
  <button id="clear-btn" title="清除对话历史并开始新会话">新会话</button>
</div>

<div id="messages"></div>

<div id="input-area">
  <textarea id="input" placeholder="输入任务..." rows="1"></textarea>
  <button id="interrupt-btn">停止</button>
  <button id="send-btn" disabled>发送</button>
</div>

<script>
const SESSION_KEY = "cc_session_id";
let sessionId = localStorage.getItem(SESSION_KEY);
let ws, isThinking = false, currentAgentBubble = null, currentAgentText = "";

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");
const interruptBtn = document.getElementById("interrupt-btn");
const clearBtn = document.getElementById("clear-btn");
const statusDot = document.getElementById("status-dot");
const statusText = document.getElementById("status-text");

function connect() {
  const wsUrl = sessionId ? `ws://${location.host}?session_id=${sessionId}` : `ws://${location.host}`;
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    statusDot.className = "connected";
    statusText.textContent = "已连接";
    sendBtn.disabled = false;
  };

  ws.onclose = () => {
    statusDot.className = "";
    statusText.textContent = "已断开，3秒后重连...";
    sendBtn.disabled = true;
    setTimeout(connect, 3000);
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === "session.created") {
      sessionId = msg.session_id;
      localStorage.setItem(SESSION_KEY, sessionId);
      statusText.textContent = `Session: ${msg.session_id.slice(0, 16)}...`;
    } else if (msg.type === "session.history") {
      messagesEl.innerHTML = "";
      for (const m of msg.messages) {
        if (m.role === "user" && m.text) appendBubble("user", m.text);
        else if (m.role === "assistant" && m.text) { const b = appendBubble("agent", ""); b.innerHTML = marked.parse(m.text); }
        if (m.tools) for (const t of m.tools) {
          if (t.input) appendToolBlock(`⚙ ${t.name}`, JSON.stringify(t.input, null, 2).slice(0, 500));
          else if (t.result) appendToolBlock(`${t.is_error ? "✗" : "✓"} ${t.name}`, t.result.slice(0, 500));
        }
      }
      scrollBottom();
    } else if (msg.type === "agent.message") {
      if (!currentAgentBubble) {
        currentAgentBubble = appendBubble("agent", "");
        currentAgentText = "";
        setThinking(true);
      }
      currentAgentText += msg.text;
      currentAgentBubble.innerHTML = marked.parse(currentAgentText);
      scrollBottom();
    } else if (msg.type === "agent.tool_use") {
      appendToolBlock(`⚙ ${msg.tool}`, JSON.stringify(msg.input, null, 2).slice(0, 1000));
    } else if (msg.type === "agent.tool_result") {
      appendToolBlock(`${msg.is_error ? "✗" : "✓"} ${msg.tool}`, String(msg.result || "").slice(0, 1000));
    } else if (msg.type === "error") {
      appendToolBlock("错误", msg.message || "Unknown error");
    } else if (msg.type === "session.interrupted") {
      appendToolBlock("停止", "已发送中断请求");
    } else if (msg.type === "session.idle") {
      if (msg.usage) appendUsageBar(msg.usage);
      if (msg.trace_id) appendTraceLink(msg.trace_id);
      currentAgentBubble = null;
      currentAgentText = "";
      setThinking(false);
    } else if (msg.type === "session.terminated") {
      currentAgentBubble = null;
      setThinking(false);
      statusText.textContent = "Session 已结束";
    }
  };
}

function appendBubble(role, text) {
  const msg = document.createElement("div");
  msg.className = `msg ${role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  msg.appendChild(bubble);
  if (role === "user") {
    const btn = document.createElement("button");
    btn.className = "resend-btn";
    btn.textContent = "↺ 重发";
    btn.onclick = () => { if (!isThinking) { inputEl.value = text; send(); } };
    msg.appendChild(btn);
  }
  messagesEl.appendChild(msg);
  scrollBottom();
  return bubble;
}

function appendToolBlock(name, text) {
  const block = document.createElement("div");
  block.className = "tool-block";
  const title = document.createElement("div");
  title.className = "tool-name";
  title.textContent = name;
  const body = document.createElement("div");
  body.textContent = text;
  block.appendChild(title);
  block.appendChild(body);
  messagesEl.appendChild(block);
  scrollBottom();
}

function appendUsageBar(usage) {
  const block = document.createElement("div");
  block.className = "tool-block";
  block.style.display = "flex";
  block.style.gap = "12px";
  block.style.alignItems = "center";
  const cached = usage.cache_read_input_tokens || 0;
  const created = usage.cache_creation_input_tokens || 0;
  block.innerHTML = `<span style="color:#666">⚡</span>` +
    `<span>in: ${usage.input_tokens?.toLocaleString()}</span>` +
    `<span>out: ${usage.output_tokens?.toLocaleString()}</span>` +
    (cached > 0 ? `<span style="color:#4caf50">cache: ${cached.toLocaleString()}</span>` : '') +
    (created > 0 ? `<span style="color:#ff9800">new cache: ${created.toLocaleString()}</span>` : '');
  messagesEl.appendChild(block);
  scrollBottom();
}

function appendTraceLink(traceId) {
  const block = document.createElement("div");
  block.className = "tool-block";
  block.innerHTML = `<a href="#" onclick="openTrace('${traceId}');return false" style="color:#ff9800;font-size:12px;text-decoration:none">📊 查看本次执行详情</a>`;
  messagesEl.appendChild(block);
  scrollBottom();
}

function openTrace(traceId) {
  if (window.parent !== window) {
    window.parent.postMessage({ type: "openTrace", sessionId, traceId }, "*");
  } else {
    location.href = `/trace-page?session=${sessionId}&trace=${traceId}`;
  }
}

function setThinking(v) {
  isThinking = v;
  statusDot.className = v ? "thinking" : "connected";
  if (!v) statusText.textContent = "就绪";
  sendBtn.disabled = v;
  interruptBtn.classList.toggle("visible", v);
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function send() {
  const text = inputEl.value.trim();
  if (!text || isThinking) return;
  appendBubble("user", text);
  ws.send(JSON.stringify({ type: "user.message", text }));
  inputEl.value = "";
  inputEl.style.height = "auto";
  setThinking(true);
  currentAgentBubble = null;
  currentAgentText = "";
}

sendBtn.onclick = send;
interruptBtn.onclick = () => ws.send(JSON.stringify({ type: "interrupt" }));
clearBtn.onclick = () => {
  if (confirm("确定要清除当前对话历史并开始新会话吗？")) {
    localStorage.removeItem(SESSION_KEY);
    sessionId = null;
    messagesEl.innerHTML = "";
    location.reload();
  }
};

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
});

connect();
</script>
</body>
</html>
